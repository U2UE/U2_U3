<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Orbit</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; width:960px; overflow:hidden; }
  .art { position:absolute; left:480px; right:24px; bottom:24px; }
  .art svg { display:block; width:456px; height:40px; }
  .c { rx:var(--radius-3); }
  .acc { fill:var(--accent); } .ink { fill:var(--ink); } .info { fill:var(--info); }
  .gig { fill:var(--gig); } .warn { fill:var(--warn); } .bad { fill:var(--bad); }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .ver { margin:12px 0 0 6px; font-family:var(--font-mono); font-size:13px; line-height:20px; color:var(--ink-3); letter-spacing:.02em; }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 456 40" width="456" height="40">
<!--
  blocks      one row of colour chips, right-aligned on the name's baseline: accent 64×40 (the one brand hue, widest) · ink, info, gig, warn, bad 24×40 each (the state colours stay small)
  arrangement a single strip, gaps space-8; nothing above it — the ground stays empty (v33 "조용함이 기본값이다")
  pattern     none, by request: no orbits, no ornament
  scales      gaps space-8; corners radius-3 (the badge radius)
-->
<rect class="acc c" x="200" y="0" width="64" height="40" rx="3"/>
<rect class="ink c" x="272" y="0" width="24" height="40" rx="3"/>
<rect class="info c" x="304" y="0" width="24" height="40" rx="3"/>
<rect class="gig c" x="336" y="0" width="24" height="40" rx="3"/>
<rect class="warn c" x="368" y="0" width="24" height="40" rx="3"/>
<rect class="bad c" x="400" y="0" width="24" height="40" rx="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">Orbit</h1>
<p class="ver">v33 · 260924</p>
</div>
</div>
</body>
</html>
